<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600" viewBox="0 0 800 600">
  <rect width="800" height="600" fill="#0d1b2a"/>
  <!-- Device body - version 4D -->
  <g transform="translate(220,100)">
    <!-- Main enclosure -->
    <rect x="0" y="0" width="360" height="240" rx="20" fill="#1a252f" stroke="#2e86de" stroke-width="3"/>
    <rect x="10" y="10" width="340" height="220" rx="14" fill="#0a1520" stroke="#1a4a6e" stroke-width="1"/>
    <!-- PCB inside -->
    <rect x="25" y="25" width="310" height="190" rx="8" fill="#0d2137"/>
    <!-- ESP32 chip -->
    <rect x="140" y="80" width="80" height="60" rx="6" fill="#1a3a5c" stroke="#2e86de" stroke-width="1.5"/>
    <text x="180" y="116" text-anchor="middle" font-family="monospace" font-size="11" fill="#5dade2">ESP32-C3</text>
    <!-- CC2500 RF module -->
    <rect x="50" y="90" width="65" height="45" rx="4" fill="#162032" stroke="#5d6d7e" stroke-width="1.2"/>
    <text x="82" y="116" text-anchor="middle" font-family="monospace" font-size="8" fill="#7f8c8d">CC2500</text>
    <!-- Antenna connector SMA -->
    <circle cx="310" cy="120" r="12" fill="#7f8c8d" stroke="#aab7b8" stroke-width="2"/>
    <circle cx="310" cy="120" r="5" fill="#bdc3c7"/>
    <!-- Green power LED -->
    <circle cx="50" cy="185" r="8" fill="#00e676"/>
    <circle cx="50" cy="185" r="14" fill="none" stroke="#00e676" stroke-width="1" opacity="0.4"/>
    <text x="70" y="190" font-family="monospace" font-size="9" fill="#00e676">PWR</text>
    <!-- Red operation LED -->
    <circle cx="130" cy="185" r="8" fill="#e74c3c"/>
    <circle cx="130" cy="185" r="14" fill="none" stroke="#e74c3c" stroke-width="1" opacity="0.4"/>
    <text x="150" y="190" font-family="monospace" font-size="9" fill="#e74c3c">OP</text>
    <!-- USB-C port -->
    <rect x="160" y="228" width="40" height="16" rx="4" fill="#566573" stroke="#aab7b8" stroke-width="1.5"/>
    <text x="180" y="240" text-anchor="middle" font-family="monospace" font-size="8" fill="#aab7b8">USB-C</text>
    <!-- Version label -->
    <text x="290" y="190" text-anchor="end" font-family="monospace" font-size="10" fill="#5d6d7e">v4D</text>
    <!-- PCB traces -->
    <line x1="115" y1="112" x2="140" y2="112" stroke="#27ae60" stroke-width="1.2"/>
    <line x1="220" y1="112" x2="248" y2="112" stroke="#27ae60" stroke-width="1.2"/>
    <line x1="180" y1="140" x2="180" y2="175" stroke="#e74c3c" stroke-width="1"/>
    <line x1="180" y1="175" x2="130" y2="185" stroke="#e74c3c" stroke-width="0.8"/>
  </g>
  <!-- Directional antenna attached -->
  <g transform="translate(572,100)">
    <rect x="0" y="40" width="16" height="160" rx="4" fill="#2e86de"/>
    <rect x="-8" y="35" width="32" height="14" rx="3" fill="#1a5276"/>
    <!-- Yagi elements -->
    <line x1="-30" y1="70" x2="46" y2="70" stroke="#aab7b8" stroke-width="3"/>
    <line x1="-25" y1="100" x2="41" y2="100" stroke="#aab7b8" stroke-width="2.5"/>
    <line x1="-20" y1="130" x2="36" y2="130" stroke="#aab7b8" stroke-width="2"/>
    <line x1="-15" y1="160" x2="31" y2="160" stroke="#aab7b8" stroke-width="1.5"/>
  </g>
  <!-- Label -->
  <text x="400" y="390" text-anchor="middle" font-family="Arial,sans-serif" font-size="28" font-weight="300" letter-spacing="8" fill="white" opacity="0.9">CALLADO BT</text>
  <text x="400" y="420" text-anchor="middle" font-family="monospace" font-size="13" fill="#5dade2" letter-spacing="3">VERSIÓN 4D — OCTUBRE 2025</text>
  <!-- Dimensions callout -->
  <g opacity="0.5" font-family="monospace" font-size="10" fill="#7f8c8d">
    <text x="400" y="470">39 × 70 × 32 mm</text>
    <text x="400" y="488">USB-C · 5V · Antena SMA</text>
  </g>
</svg>
