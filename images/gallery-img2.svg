<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600" viewBox="0 0 800 600">
  <rect width="800" height="600" fill="#0a1520"/>
  <!-- Device in operation - side view with LEDs lit -->
  <g transform="translate(200,150)">
    <!-- Enclosure side -->
    <rect x="0" y="0" width="250" height="140" rx="14" fill="#1a252f" stroke="#2e86de" stroke-width="2.5"/>
    <!-- Seam line -->
    <line x1="0" y1="70" x2="250" y2="70" stroke="#0d1b2a" stroke-width="2"/>
    <!-- Green LED glow (POWER ON) -->
    <circle cx="40" cy="110" r="8" fill="#00e676"/>
    <circle cx="40" cy="110" r="18" fill="none" stroke="#00e676" stroke-width="2" opacity="0.5"/>
    <circle cx="40" cy="110" r="30" fill="none" stroke="#00e676" stroke-width="1" opacity="0.2"/>
    <!-- Red LED glow (OPERATING) -->
    <circle cx="80" cy="110" r="8" fill="#e74c3c"/>
    <circle cx="80" cy="110" r="18" fill="none" stroke="#e74c3c" stroke-width="2" opacity="0.5"/>
    <circle cx="80" cy="110" r="30" fill="none" stroke="#e74c3c" stroke-width="1" opacity="0.2"/>
    <!-- USB-C side port -->
    <rect x="230" y="62" width="22" height="12" rx="3" fill="#566573" stroke="#aab7b8" stroke-width="1.5"/>
    <!-- Push button (back) -->
    <circle cx="210" cy="35" r="10" fill="#2c3e50" stroke="#7f8c8d" stroke-width="1.5"/>
    <text x="210" y="39" text-anchor="middle" font-family="monospace" font-size="8" fill="#aab7b8">BTN</text>
    <!-- Label on enclosure -->
    <text x="125" y="40" text-anchor="middle" font-family="Arial" font-size="14" font-weight="700" letter-spacing="4" fill="rgba(255,255,255,0.7)">CALLADO BT</text>
    <text x="125" y="57" text-anchor="middle" font-family="monospace" font-size="9" fill="rgba(255,255,255,0.35)" letter-spacing="2">4D</text>
    <!-- Antenna SMA connector -->
    <rect x="238" y="50" width="14" height="14" rx="2" fill="#7f8c8d"/>
  </g>
  <!-- Antenna sticking out to the right -->
  <g transform="translate(452,175)">
    <rect x="0" y="0" width="14" height="140" rx="3" fill="#2e86de"/>
    <!-- Yagi elements horizontal -->
    <line x1="-20" y1="20" x2="34" y2="20" stroke="#aab7b8" stroke-width="3"/>
    <line x1="-16" y1="50" x2="30" y2="50" stroke="#aab7b8" stroke-width="2.5"/>
    <line x1="-13" y1="80" x2="27" y2="80" stroke="#aab7b8" stroke-width="2"/>
    <line x1="-10" y1="110" x2="24" y2="110" stroke="#aab7b8" stroke-width="1.8"/>
    <!-- Signal waves -->
    <path d="M50,70 Q70,50 50,30" stroke="#00d2ff" stroke-width="2" fill="none" opacity="0.8"/>
    <path d="M65,70 Q92,42 65,15" stroke="#00d2ff" stroke-width="1.5" fill="none" opacity="0.6"/>
    <path d="M80,70 Q115,34 80,0" stroke="#00d2ff" stroke-width="1" fill="none" opacity="0.4"/>
  </g>
  <!-- Power bank connected -->
  <g transform="translate(110,350)">
    <rect x="0" y="0" width="180" height="60" rx="10" fill="#17202a" stroke="#5d6d7e" stroke-width="1.5"/>
    <text x="90" y="35" text-anchor="middle" font-family="monospace" font-size="12" fill="#7f8c8d">POWER BANK</text>
    <!-- USB-A port -->
    <rect x="155" y="22" width="20" height="14" rx="2" fill="#566573" stroke="#aab7b8" stroke-width="1"/>
    <!-- USB cable -->
    <path d="M175,29 Q220,29 222,85" stroke="#aab7b8" stroke-width="2.5" fill="none" stroke-dasharray="3,2"/>
  </g>
  <!-- Caption -->
  <text x="400" y="510" text-anchor="middle" font-family="Arial" font-size="16" fill="rgba(255,255,255,0.8)" letter-spacing="2">OPERACIÓN — LED VERDE: ENCENDIDO · LED ROJO: MODO ACTIVO</text>
</svg>
