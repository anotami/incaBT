<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600" viewBox="0 0 800 600">
  <rect width="800" height="600" fill="#0b1622"/>
  <!-- Assembly diagram - two components -->
  <text x="400" y="50" text-anchor="middle" font-family="Arial" font-size="20" font-weight="300" letter-spacing="6" fill="rgba(255,255,255,0.8)">MONTAJE</text>
  <text x="400" y="72" text-anchor="middle" font-family="monospace" font-size="11" fill="#5dade2" letter-spacing="2">SOLO DOS COMPONENTES</text>

  <!-- Component 1: ESP32-C3 board -->
  <g transform="translate(80,120)">
    <text x="130" y="0" text-anchor="middle" font-family="monospace" font-size="12" fill="#00e676" letter-spacing="2">① PLACA ESP32-C3</text>
    <!-- Board PCB -->
    <rect x="30" y="20" width="200" height="120" rx="8" fill="#1a3a0d" stroke="#27ae60" stroke-width="2"/>
    <!-- Chip -->
    <rect x="80" y="45" width="80" height="55" rx="6" fill="#1a3a5c" stroke="#2e86de" stroke-width="1.5"/>
    <text x="120" y="77" text-anchor="middle" font-family="monospace" font-size="10" fill="#5dade2">ESP32-C3</text>
    <!-- USB-C -->
    <rect x="103" y="128" width="34" height="14" rx="3" fill="#566573" stroke="#aab7b8" stroke-width="1.2"/>
    <!-- LED -->
    <circle cx="55" cy="110" r="5" fill="#00e676"/>
    <!-- SMA connector -->
    <circle cx="200" cy="80" r="8" fill="#7f8c8d" stroke="#aab7b8" stroke-width="1.5"/>
    <!-- Pin headers -->
    <g fill="#bdc3c7">
      <rect x="31" y="45" width="6" height="70" rx="1"/>
      <rect x="223" y="45" width="6" height="70" rx="1"/>
    </g>
    <!-- Price tag -->
    <text x="130" y="165" text-anchor="middle" font-family="monospace" font-size="11" fill="#f39c12">~u$9</text>
  </g>

  <!-- Plus sign -->
  <g transform="translate(330,220)">
    <text x="0" y="0" text-anchor="middle" font-family="Arial" font-size="48" fill="#2e86de" opacity="0.8">+</text>
  </g>

  <!-- Component 2: CC2500 RF module -->
  <g transform="translate(430,120)">
    <text x="130" y="0" text-anchor="middle" font-family="monospace" font-size="12" fill="#e74c3c" letter-spacing="2">② MÓDULO CC2500</text>
    <!-- Module PCB -->
    <rect x="50" y="20" width="160" height="100" rx="6" fill="#2d0d0d" stroke="#e74c3c" stroke-width="2"/>
    <!-- CC2500 chip -->
    <rect x="90" y="40" width="70" height="50" rx="4" fill="#17202a" stroke="#c0392b" stroke-width="1.5"/>
    <text x="125" y="70" text-anchor="middle" font-family="monospace" font-size="10" fill="#e74c3c">CC2500</text>
    <!-- Antenna pad -->
    <line x1="210" y1="70" x2="240" y2="70" stroke="#aab7b8" stroke-width="2"/>
    <text x="255" y="74" font-family="monospace" font-size="9" fill="#7f8c8d">ANT</text>
    <!-- Pin header -->
    <g fill="#bdc3c7">
      <rect x="51" y="40" width="6" height="60" rx="1"/>
    </g>
    <!-- 2.4GHz band annotation -->
    <text x="125" y="108" text-anchor="middle" font-family="monospace" font-size="9" fill="#c0392b">2.4 GHz</text>
    <!-- Price tag -->
    <text x="130" y="140" text-anchor="middle" font-family="monospace" font-size="11" fill="#f39c12">~u$6</text>
  </g>

  <!-- Arrow pointing down to final device -->
  <g transform="translate(365,310)">
    <line x1="0" y1="0" x2="0" y2="60" stroke="#2e86de" stroke-width="2"/>
    <polygon points="-8,50 8,50 0,70" fill="#2e86de"/>
  </g>

  <!-- Final assembled device -->
  <g transform="translate(260,390)">
    <text x="140" y="0" text-anchor="middle" font-family="monospace" font-size="12" fill="white" letter-spacing="2">RESULTADO FINAL</text>
    <rect x="30" y="15" width="220" height="130" rx="14" fill="#1a252f" stroke="#2e86de" stroke-width="2.5"/>
    <text x="140" y="85" text-anchor="middle" font-family="Arial" font-size="16" font-weight="700" letter-spacing="4" fill="rgba(255,255,255,0.8)">CALLADO BT</text>
    <circle cx="60" cy="115" r="6" fill="#00e676"/>
    <circle cx="80" cy="115" r="6" fill="#e74c3c"/>
    <rect x="230" y="60" width="22" height="10" rx="2" fill="#566573"/>
    <!-- antenna -->
    <rect x="240" y="15" width="10" height="80" rx="3" fill="#2e86de"/>
    <line x1="230" y1="25" x2="262" y2="25" stroke="#aab7b8" stroke-width="2.5"/>
    <line x1="232" y1="45" x2="260" y2="45" stroke="#aab7b8" stroke-width="2"/>
    <line x1="234" y1="65" x2="258" y2="65" stroke="#aab7b8" stroke-width="1.5"/>
  </g>
  <!-- Total cost -->
  <text x="400" y="570" text-anchor="middle" font-family="Arial" font-size="15" fill="#f39c12" letter-spacing="2">TOTAL: ~u$15 · UN DESTORNILLADOR · UN CABLE USB · UN NAVEGADOR</text>
</svg>
