<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
  <defs>
    <radialGradient id="bg2" cx="30%" cy="60%" r="80%">
      <stop offset="0%" stop-color="#1c2e4a"/>
      <stop offset="100%" stop-color="#050b14"/>
    </radialGradient>
  </defs>
  <rect width="1920" height="1080" fill="url(#bg2)"/>
  <!-- Concentric signal rings from antenna -->
  <g transform="translate(960,540)" opacity="0.15">
    <circle cx="0" cy="0" r="100" fill="none" stroke="#2e86de" stroke-width="1"/>
    <circle cx="0" cy="0" r="200" fill="none" stroke="#2e86de" stroke-width="0.8"/>
    <circle cx="0" cy="0" r="300" fill="none" stroke="#2e86de" stroke-width="0.6"/>
    <circle cx="0" cy="0" r="400" fill="none" stroke="#2e86de" stroke-width="0.5"/>
    <circle cx="0" cy="0" r="500" fill="none" stroke="#1a5276" stroke-width="0.4"/>
    <circle cx="0" cy="0" r="600" fill="none" stroke="#1a5276" stroke-width="0.3"/>
    <circle cx="0" cy="0" r="700" fill="none" stroke="#154360" stroke-width="0.3"/>
  </g>
  <!-- Device top-down view -->
  <g transform="translate(810,390)">
    <rect x="0" y="0" width="300" height="160" rx="20" fill="#0d1b2a" stroke="#2e86de" stroke-width="2"/>
    <!-- internal board -->
    <rect x="20" y="20" width="260" height="120" rx="8" fill="#0a2540" stroke="#1a5276" stroke-width="1"/>
    <!-- Green LED -->
    <circle cx="50" cy="80" r="7" fill="#00e676"/>
    <circle cx="50" cy="80" r="12" fill="none" stroke="#00e676" stroke-width="1" opacity="0.4"/>
    <!-- Red LED -->
    <circle cx="250" cy="80" r="7" fill="#e74c3c"/>
    <!-- USB-C at bottom -->
    <rect x="125" y="148" width="50" height="18" rx="4" fill="#566573" stroke="#aab7b8" stroke-width="1.2"/>
    <!-- BT chip -->
    <rect x="120" y="50" width="60" height="60" rx="6" fill="#1a3a5c" stroke="#2e86de" stroke-width="1.5"/>
    <text x="150" y="86" text-anchor="middle" font-family="monospace" font-size="9" fill="#5dade2">ESP32-C3</text>
    <!-- PCB traces -->
    <line x1="65" y1="80" x2="110" y2="80" stroke="#27ae60" stroke-width="1.2"/>
    <line x1="190" y1="80" x2="240" y2="80" stroke="#27ae60" stroke-width="1.2"/>
    <line x1="150" y1="120" x2="150" y2="140" stroke="#e74c3c" stroke-width="1"/>
    <!-- RF module -->
    <rect x="55" y="40" width="45" height="35" rx="3" fill="#17202a" stroke="#5d6d7e" stroke-width="1"/>
    <text x="77" y="62" text-anchor="middle" font-family="monospace" font-size="7" fill="#7f8c8d">CC2500</text>
  </g>
  <!-- Antenna extending up -->
  <g transform="translate(1085,250)">
    <rect x="8" y="0" width="14" height="160" rx="4" fill="#2e86de" opacity="0.8"/>
    <rect x="0" y="0" width="30" height="14" rx="3" fill="#1a5276"/>
    <!-- Directional array lines -->
    <line x1="-20" y1="30" x2="-60" y2="20" stroke="#00d2ff" stroke-width="1.5" opacity="0.6"/>
    <line x1="-20" y1="50" x2="-70" y2="50" stroke="#00d2ff" stroke-width="1.5" opacity="0.5"/>
    <line x1="-20" y1="70" x2="-60" y2="80" stroke="#00d2ff" stroke-width="1.5" opacity="0.4"/>
    <line x1="50" y1="30" x2="90" y2="20" stroke="#00d2ff" stroke-width="1.5" opacity="0.6"/>
    <line x1="50" y1="50" x2="100" y2="50" stroke="#00d2ff" stroke-width="1.5" opacity="0.5"/>
    <line x1="50" y1="70" x2="90" y2="80" stroke="#00d2ff" stroke-width="1.5" opacity="0.4"/>
  </g>
</svg>
