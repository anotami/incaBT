<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
  <defs>
    <radialGradient id="bg4" cx="70%" cy="40%" r="80%">
      <stop offset="0%" stop-color="#162032"/>
      <stop offset="100%" stop-color="#060d18"/>
    </radialGradient>
  </defs>
  <rect width="1920" height="1080" fill="url(#bg4)"/>
  <!-- WiFi / BT frequency spectrum visualization -->
  <g transform="translate(200,600)">
    <text x="0" y="-20" font-family="monospace" font-size="11" fill="#5d6d7e">2.4 GHz SPECTRUM</text>
    <!-- Frequency axis -->
    <line x1="0" y1="0" x2="1500" y2="0" stroke="#2c3e50" stroke-width="1"/>
    <!-- BT channels -->
    <g fill="#2e86de" opacity="0.7">
      <rect x="30" y="-60" width="8" height="60"/>
      <rect x="60" y="-80" width="8" height="80"/>
      <rect x="90" y="-45" width="8" height="45"/>
      <rect x="120" y="-110" width="8" height="110"/>
      <rect x="150" y="-70" width="8" height="70"/>
      <rect x="180" y="-90" width="8" height="90"/>
      <rect x="210" y="-55" width="8" height="55"/>
      <rect x="240" y="-130" width="8" height="130"/>
      <rect x="270" y="-85" width="8" height="85"/>
      <rect x="300" y="-65" width="8" height="65"/>
    </g>
    <!-- WiFi channels -->
    <g fill="#e74c3c" opacity="0.5">
      <rect x="420" y="-40" width="20" height="40"/>
      <rect x="560" y="-150" width="20" height="150"/>
      <rect x="700" y="-35" width="20" height="35"/>
      <rect x="840" y="-80" width="20" height="80"/>
    </g>
    <!-- Labels -->
    <text x="30" y="20" font-family="monospace" font-size="9" fill="#7f8c8d">BT CH 1-10</text>
    <text x="420" y="20" font-family="monospace" font-size="9" fill="#e74c3c" opacity="0.7">WiFi CH1</text>
    <text x="560" y="20" font-family="monospace" font-size="9" fill="#e74c3c" opacity="0.7">WiFi CH6</text>
    <!-- Scanning line -->
    <line x1="240" y1="-150" x2="240" y2="10" stroke="#00e676" stroke-width="1.5" opacity="0.8" stroke-dasharray="4,2"/>
    <text x="248" y="-155" font-family="monospace" font-size="9" fill="#00e676">SCAN</text>
  </g>
  <!-- Device in hand illustration (silhouette) -->
  <g transform="translate(1300,200)">
    <!-- Hand outline simplified -->
    <path d="M100,400 Q80,380 70,340 L60,200 Q58,160 80,155 Q100,150 105,175 L110,200 L115,160 Q113,120 135,118 Q158,116 162,145 L165,175 L170,140 Q168,100 190,98 Q212,96 215,130 L218,165 L222,140 Q220,110 240,110 Q262,110 263,140 L265,250 Q280,230 300,230 Q320,230 322,255 Q324,280 305,300 L290,350 Q280,390 260,410 Z"
          fill="#1a252f" stroke="#2e86de" stroke-width="1.5" opacity="0.8"/>
    <!-- Device in palm -->
    <rect x="100" y="260" width="120" height="75" rx="10" fill="#0d1b2a" stroke="#2e86de" stroke-width="2"/>
    <circle cx="130" cy="297" r="6" fill="#00e676"/>
    <circle cx="190" cy="297" r="6" fill="#e74c3c"/>
    <rect x="148" y="275" width="40" height="30" rx="4" fill="#1a3a5c" stroke="#2e86de" stroke-width="1"/>
    <!-- Antenna sticking up -->
    <line x1="215" y1="260" x2="215" y2="160" stroke="#2e86de" stroke-width="3"/>
    <line x1="215" y1="160" x2="230" y2="175" stroke="#2e86de" stroke-width="2"/>
    <line x1="230" y1="175" x2="230" y2="210" stroke="#2e86de" stroke-width="2"/>
    <line x1="230" y1="195" x2="215" y2="210" stroke="#2e86de" stroke-width="2"/>
    <!-- Signal waves -->
    <path d="M248,185 Q260,165 248,145" stroke="#00d2ff" stroke-width="2" fill="none" opacity="0.8"/>
    <path d="M263,185 Q280,158 263,132" stroke="#00d2ff" stroke-width="1.5" fill="none" opacity="0.5"/>
  </g>
</svg>
